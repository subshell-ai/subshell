pre-commit:
  parallel: true
  commands:
    "update bun lockfile":
      glob: "**/package.json"
      run: bun install
      stage_fixed: true
    "format package.json files":
      glob: "**/package.json"
      run: bun run syncpack:format
      stage_fixed: true
      tags:
        - package-lint
    "check package.json files":
      glob: "**/package.json"
      run: bun run syncpack:lint
      stage_fixed: true
      tags:
        - package-lint
    "lint staged":
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,html,css}"
      # `bunx`, not a bare `turbo`: a bare one resolves off PATH, and a
      # globally installed turbo of a different version wedges in its own
      # daemon — measured here as a pre-commit that never returns, against a
      # pnpm-global 2.0.12 while this repo pins 2.10.11. Every other script in
      # the repo already goes through the workspace copy.
      run: bunx turbo run lint:staged
      stage_fixed: true
      tags:
        - lint
        - staged-lint

pre-push:
  parallel: true
  commands:
    "verify types":
      run: bun run verify-types
      tags:
        - types
    "lint":
      run: bun run lint:check
      tags:
        - lint
    "licenses":
      run: bun run lint:licenses
      tags:
        - lint
    "design tokens":
      run: bun run lint:design:report
      tags:
        - lint
    # NOTE: the test suite deliberately does NOT run here — CI (.github/workflows/test.yml)
    # owns it; a local push shouldn't cost 30+ s. Run `bun run test` by hand when you want it.
