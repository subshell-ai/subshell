name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Turbo v2 writes its local cache here.
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      # The TmuxRunner suite drives a real tmux server.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Run Package(s) Tests
        run: bun run test

      # Compiled-binary smoke guards against bundler import-graph defects
      # (e.g. oven-sh/bun#31586 — zod subpath duplication) that source-level
      # `bun test` cannot see.
      - name: Compiled binary smoke
        run: |
          set -euo pipefail
          cd apps/server
          bun run compile
          bin="$PWD/dist/subshell-server"
          expected="subshell-server $(jq -r .version package.json)"
          actual="$("$bin" version)"
          [ "$actual" = "$expected" ] || { echo "version mismatch: got '$actual', want '$expected'"; exit 1; }
          # `mcp` without the pane env must refuse NON-ZERO with the
          # SUBSHELL_API_KEY contract error, and the refusal must not litter
          # the CWD with data/ (no boot-graph IO on the CLI path). env -i keeps
          # the refusal deterministic — a leaked SUBSHELL_* env must never let
          # it connect instead.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          set +e
          out="$(env -i PATH="$PATH" HOME="$tmp" "$bin" mcp </dev/null 2>&1)"
          code=$?
          set -e
          [ "$code" -ne 0 ] || { echo "mcp subcommand unexpectedly exited 0"; exit 1; }
          echo "$out"
          printf '%s' "$out" | grep -q "SUBSHELL_API_KEY" || { echo "mcp refused for the wrong reason (above)"; exit 1; }
          if [ -e "$tmp/data" ]; then echo "mcp refusal created a data/ dir in the CWD"; exit 1; fi
          echo "compiled-binary smoke OK: version + clean mcp env-contract refusal"

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Turbo v2 writes its local cache here.
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      # The session-lifecycle spec spawns real tmux sessions (stub harness).
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      # Keyed on the Playwright version so a bump downloads a matching browser.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: bun run test:e2e:install

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
