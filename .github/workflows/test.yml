name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every check on the caller's exact revision before a release.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# A release caller must not cancel itself or a PR run of the same revision.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full || false }}
  cancel-in-progress: ${{ !inputs.full }}

env:
  # Keep the measured serial regime; package/job selection removes unrelated work.
  SUBSHELL_TEST_SERIAL: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      units: ${{ steps.route.outputs.units }}
      integration: ${{ steps.route.outputs.integration }}
      rust: ${{ steps.route.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Select checks without installing dependencies
        id: route
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = true ]; then
            bun scripts/ci-test-plan.ts --full
          else
            bun scripts/ci-test-plan.ts "$BASE"
          fi

  checks:
    name: Build, types, and lint
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
      - run: bun scripts/run-test-plan.ts checks
      - name: Check shell scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning proxmox-server.sh proxmox-node.sh docker-entrypoint.sh scripts/cli-e2e/docker-image.sh scripts/test-compiled-smoke.sh scripts/par-test.sh scripts/rust-check.sh

  unit:
    name: Unit tests (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.units != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.units) }}
    env:
      TEST_PLAN: ${{ needs.plan.outputs.plan }}
      TEST_LANE: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          cache-suffix: ${{ matrix.name }}
      - name: Ensure test tools
        run: |
          if ! command -v tmux || ! command -v jq || ! command -v ssh-keygen; then
            sudo apt-get update
            sudo apt-get install -y tmux jq openssh-client
          fi
      - run: bun scripts/run-test-plan.ts unit

  integration:
    name: Browser and compiled CLI tests
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    # Bare runner: Testcontainers needs the host Docker daemon and reachable mapped ports.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TEST_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          cache-suffix: integration
      - name: Ensure integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq openssh-client openssh-server
          docker info >/dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: fromJSON(needs.plan.outputs.plan).e2e
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
      - name: Install browser
        if: fromJSON(needs.plan.outputs.plan).e2e
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - run: bun scripts/run-test-plan.ts integration
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  rust:
    name: Rust (Linux)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    container: ghcr.io/subshell-ai/desktop-builder:ubuntu24.04
    timeout-minutes: 40
    env:
      TEST_PLAN: ${{ needs.plan.outputs.plan }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends cmake clang libclang-dev
          rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            crates/desktop-core/target
            apps/server/desktop/src-tauri/target
            apps/client/desktop/src-tauri/target
          key: linux-rust-${{ hashFiles('**/Cargo.lock', 'native/display-helper/**') }}
          restore-keys: linux-rust-
      - run: bun scripts/run-test-plan.ts rust

  macos:
    name: Rust and native display helper (macOS)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    env:
      TEST_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/desktop-core/target
            apps/client/desktop/src-tauri/target
            apps/server/desktop/src-tauri/target
          key: macos-rust-${{ hashFiles('**/Cargo.lock', 'native/display-helper/**') }}
          restore-keys: macos-rust-
      - run: rustup component add rustfmt clippy
      - run: bun scripts/run-test-plan.ts rust

  result:
    name: Tests passed
    if: always()
    needs: [plan, checks, unit, integration, rust, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['plan']['result'] == 'success', 'Planning failed'
          outputs = jobs['plan']['outputs']
          required = ['checks']
          if json.loads(outputs['units']): required.append('unit')
          if outputs['integration'] == 'true': required.append('integration')
          if outputs['rust'] == 'true': required += ['rust', 'macos']
          failed = [name for name in required if jobs[name]['result'] != 'success']
          assert not failed, f'Required checks did not pass: {failed}'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('All selected checks passed.\n\n```json\n' + outputs['plan'] + '\n```\n')
          PY
