name: Test

# EVERY job here runs on the self-hosted fleet, inside the repo's own builder
# image — GitHub-hosted minutes are metered on a private repo and this is the
# workflow that spends them (roughly 9 of the ~12 per push).
#
# The image (docker/desktop-builder.Dockerfile) already carries bun 1.4.0,
# rustup stable and Tauri's system dependencies, which is why the jobs below
# no longer install any of that: `setup-bun`, `dtolnay/rust-toolchain` and
# every `sudo apt-get` are gone. Nothing on the fleet is assumed — note that
# release.yml, which has always run there, never invokes sudo either, so
# passwordless root on the host is NOT something this repo relies on. Inside a
# container we simply ARE root, which is also what makes Playwright's
# `install-deps` possible.
#
# THE COST OF THE CONTAINER is that it writes as root onto a PERSISTENT
# workspace, so every job ends with an un-root step (`if: always()`) copied
# from release.yml. Without it the next job on that runner dies in
# `actions/checkout` with `EACCES`, which reads like a checkout bug rather than
# a leftover — the failure `reset-linux-runner-workspace.yml` exists to repair.
#
# `timeout-minutes` on every job is not boilerplate: there are TWO Linux
# runners, so a hung job starves every other workflow, releases included.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # The container jobs pull ghcr.io/subshell-ai/desktop-builder, which inherits
  # this repo's visibility. Without this the runner's docker pull is DENIED and
  # the job dies in "Initialize containers" before a single step runs — the
  # same trap release.yml documents.
  packages: read

jobs:
  test:
    name: Testing
    runs-on: [self-hosted, Linux, X64]
    container: ghcr.io/subshell-ai/desktop-builder:ubuntu24.04
    timeout-minutes: 30
    defaults:
      run:
        # A container job defaults to `sh`, not bash, and these steps use
        # `set -o pipefail`. Same reason release.yml sets it.
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The TmuxRunner suite drives a real tmux server. Idempotent so it costs
      # nothing once the image bakes tmux in (it is in the Dockerfile now, but
      # a PR still pulls whatever tag `main` last published).
      - name: Ensure tmux and jq
        run: |
          set -euo pipefail
          missing=()
          for tool in tmux jq; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          tmux -V && jq --version

      # tsdown/rolldown run under NODE, not bun — their bin shebang is
      # `#!/usr/bin/env node` — so the repo has always had a Node requirement
      # it never declared, and CI silently inherited whatever the host had.
      # ubuntu-latest shipped 20+; the fleet has 18.19, and rolldown needs
      # `styleText` from `node:util` (20.12+), so the build broke on the move.
      #
      # Pinned to the `engines.node` the root package.json now declares, NOT
      # to rolldown's floor — Ubuntu 24.04's apt node is 18, so the image
      # cannot supply this and setup-node is the only route.
      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Turbo v2 writes its local cache here.
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Run Package(s) Tests
        run: bun run test

      # Compiled-binary smoke guards against bundler import-graph defects
      # (e.g. oven-sh/bun#31586 — zod subpath duplication) that source-level
      # `bun test` cannot see.
      - name: Compiled binary smoke
        run: |
          set -euo pipefail
          cd apps/server/api
          bun run compile
          bin="$PWD/dist/subshell-server"
          expected="subshell-server $(jq -r .version package.json)"
          actual="$("$bin" version)"
          [ "$actual" = "$expected" ] || { echo "version mismatch: got '$actual', want '$expected'"; exit 1; }
          # The `mcp` refusal contract (clean-env refusal + no CWD litter)
          # lives in ONE script, shared with the release shards.
          bash ../../../scripts/smoke-mcp-refusal.sh "$bin"
          # Real-bytes pin for the renamed-artifact guard (7d5d6f4): the unit
          # tests fake the compiled argv[1]; this asserts against a REAL
          # compiled copy under a foreign name that the self rung never
          # resolves from baked/virtual build paths (`via self` would bake an
          # entry that cannot exist on the target host).
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp "$bin" "$tmp/renamed-server"
          status_out="$("$tmp/renamed-server" status 2>&1 || true)"
          echo "$status_out"
          if printf '%s' "$status_out" | grep -q "via self"; then echo "renamed compiled binary self-resolved its mcp entrypoint"; exit 1; fi
          echo "compiled-binary smoke OK: version + clean mcp refusal + renamed-artifact fall-through"

      - name: Un-root the workspace
        if: always()
        run: |
          set -euo pipefail
          own="$(stat -c '%u:%g' "$RUNNER_WORKSPACE")"
          echo "restoring workspace ownership to $own"
          chown -R "$own" "$GITHUB_WORKSPACE"

  # The shared Rust library both desktop apps depend on. Its own job because it
  # has NO tauri dependency and therefore none of Tauri's system deps — it is a
  # ~30-second job, and keeping it separate means the apps' matrix legs do not
  # each re-run it.
  desktop-core-rust:
    name: Desktop core (Rust)
    runs-on: [self-hosted, Linux, X64]
    container: ghcr.io/subshell-ai/desktop-builder:ubuntu24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image installs rustup with `--profile minimal`, which does NOT
      # carry rustfmt or clippy — and this job is nothing but those two plus
      # tests. Idempotent, so it is a no-op once the image bakes them in.
      - name: Ensure rustfmt and clippy
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --version && cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # CARGO_HOME is /usr/local/cargo in the image, not ~/.cargo.
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            crates/desktop-core/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('crates/desktop-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      - name: Format, lint and test
        working-directory: crates/desktop-core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Un-root the workspace
        if: always()
        run: |
          set -euo pipefail
          own="$(stat -c '%u:%g' "$RUNNER_WORKSPACE")"
          echo "restoring workspace ownership to $own"
          chown -R "$own" "$GITHUB_WORKSPACE"

  # The two Tauri apps' Rust halves. Deliberately their OWN job rather than part
  # of `bun run test`: cargo is kept out of the turbo build graph, and these
  # need Tauri's system deps — which is exactly what the builder image carries,
  # so the old `sudo apt-get install libwebkit2gtk…` step is gone.
  desktop-rust:
    name: Desktop (Rust) — ${{ matrix.app }}
    runs-on: [self-hosted, Linux, X64]
    container: ghcr.io/subshell-ai/desktop-builder:ubuntu24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      # Two runners, two legs — they will queue rather than run side by side.
      fail-fast: false
      matrix:
        # `app` is the component id (also the release tag prefix); `dir` is
        # where it lives under apps/. The two diverged when the apps became
        # nested — see release.yml's plan job for the same table.
        include:
          - app: desktop-server
            dir: server/desktop
            sidecar: subshell-server-bundled
          - app: desktop-client
            dir: client/desktop
            sidecar: subshell-node-bundled
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure rustfmt and clippy
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            apps/${{ matrix.dir }}/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/src-tauri/Cargo.lock', matrix.dir), 'crates/desktop-core/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.app }}-

      # `tauri-build` REFUSES TO BUILD when an `externalBin` file is missing,
      # and the staged sidecar is a gitignored ~110 MB build input — so a clean
      # checkout cannot compile this crate at all without one. `bun run
      # rust:check` does the same thing locally.
      #
      # A stub is the right answer here rather than a real build. This job tests
      # the Rust logic — the resolution ladder, the ExecStart parser, the
      # install policy, the process runner — none of which executes the sidecar;
      # and `tauri-build` only checks that the path EXISTS. The real bundle,
      # with a real binary inside it, is proven by
      # `scripts/smoke-desktop-bundle.sh` on the release shards.
      - name: Stage a stub sidecar
        working-directory: apps/${{ matrix.dir }}/src-tauri
        env:
          SIDECAR: ${{ matrix.sidecar }}
        run: |
          set -euo pipefail
          triple="$(rustc --print host-tuple)"
          install -m 755 /dev/null "binaries/$SIDECAR-$triple"
          echo "staged a STUB sidecar for $triple (the release pipeline stages a real one)"

      - name: Format, lint and test
        working-directory: apps/${{ matrix.dir }}/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Un-root the workspace
        if: always()
        run: |
          set -euo pipefail
          own="$(stat -c '%u:%g' "$RUNNER_WORKSPACE")"
          echo "restoring workspace ownership to $own"
          chown -R "$own" "$GITHUB_WORKSPACE"

  e2e:
    name: End-to-end
    runs-on: [self-hosted, Linux, X64]
    container: ghcr.io/subshell-ai/desktop-builder:ubuntu24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The session-lifecycle spec spawns real tmux sessions (stub harness).
      - name: Ensure tmux and jq
        run: |
          set -euo pipefail
          missing=()
          for tool in tmux jq; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ ${#missing[@]} -gt 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          tmux -V && jq --version

      # tsdown/rolldown run under NODE, not bun — their bin shebang is
      # `#!/usr/bin/env node` — so the repo has always had a Node requirement
      # it never declared, and CI silently inherited whatever the host had.
      # ubuntu-latest shipped 20+; the fleet has 18.19, and rolldown needs
      # `styleText` from `node:util` (20.12+), so the build broke on the move.
      #
      # Pinned to the `engines.node` the root package.json now declares, NOT
      # to rolldown's floor — Ubuntu 24.04's apt node is 18, so the image
      # cannot supply this and setup-node is the only route.
      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Turbo v2 writes its local cache here.
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      # Keyed on the Playwright version so a bump downloads a matching browser.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # `install-browsers` is `playwright install chromium` — it fetches the
      # browser but NOT the shared libraries it dlopens, which ubuntu-latest
      # happened to already have and a bare ubuntu:24.04 image does not. A
      # chromium that downloads fine and then cannot launch is the failure this
      # avoids. Kept out of the package script deliberately: `install-deps`
      # needs root, which a developer's machine should not be asked for.
      - name: Install Chromium system libraries
        working-directory: e2e
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bun run test:e2e:install

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Un-root the workspace
        if: always()
        run: |
          set -euo pipefail
          own="$(stat -c '%u:%g' "$RUNNER_WORKSPACE")"
          echo "restoring workspace ownership to $own"
          chown -R "$own" "$GITHUB_WORKSPACE"
