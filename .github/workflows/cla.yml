name: CLA

# Subshell is dual-licensed: AGPL-3.0 under apps/server/, Apache-2.0 elsewhere,
# and the maintainer sells non-AGPL commercial licences of the server. That is
# only possible while the maintainer holds re-licensing rights over every line
# of it — a single unsigned third-party contribution to apps/server/ would bind
# every commercial licence that could otherwise be granted. This bot is what
# keeps that true. See CLA.md.
#
# A DCO would NOT substitute: it attests to provenance and grants nothing.

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - synchronize
      - closed

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the CLA signature
        if: (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with contents:write on the signature repository.
          # Deliberately NOT the default GITHUB_TOKEN: signatures are stored
          # outside this repo so a force-push here can never drop them.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: main
          path-to-document: https://github.com/subshell-ai/subshell/blob/main/CLA.md
          path-to-signatures: signatures/subshell.json
          remote-organization-name: subshell-ai
          remote-repository-name: cla-signatures
          allowlist: theogravity,bot*,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/subshell-ai/subshell/blob/main/CLA.md)
            and sign it by posting the line below as a comment. You keep the
            copyright in your work; this grants the maintainer the right to
            license it, which is what lets Subshell stay AGPL and still offer
            commercial licences. You only ever sign once.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
