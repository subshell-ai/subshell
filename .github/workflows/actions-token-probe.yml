name: Actions token probe (TEMPORARY)

# Diagnostics for the 2026-09-30 release-cut failure: POST /releases returns
# 403 "Resource not accessible by integration" from the publish job (two
# attempts) although the job token's header says Contents: write, while the
# SAME token created branches/PRs minutes later and created
# cli-server-v1.7.0's release earlier the same day. This workflow repeats the
# exact calls with the token THIS workflow's run gets, and reports the HTTP
# outcome for each. Delete it once the answer is known (tracked in the PR).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Token identity and scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "actor: ${{ github.actor }}  event: ${{ github.event_name }}  sha: ${{ github.sha }}"
          gh api /repos/"$GITHUB_REPOSITORY" --jq '"repo push permission visible to token: \(.permissions | tostring)"' || echo "GET repo FAILED"
      - name: POST /git/refs (create a branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BR="token-probe-$(date +%s)"
          gh api -X POST "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$BR" -f sha="$GITHUB_SHA" 2>&1
          echo "create-ref exit: $?"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BR" --jq '.ref' 2>&1 | head -2
      - name: POST /releases (create a draft, then delete it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TAG="token-probe-$(date +%s)"
          OUT="$(gh api -X POST "/repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=true -F make_latest=false 2>&1)"
          echo "create-release exit: $?"
          echo "$OUT" | head -5
          ID="$(echo "$OUT" | python3 -c 'import sys,json;
          try: print(json.load(sys.stdin).get("id",""))
          except Exception: print("")')"
          if [ -n "$ID" ]; then
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$ID" && echo "release deleted"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" && echo "tag deleted"
          fi
      - name: Clean up any probe branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api "/repos/$GITHUB_REPOSITORY/git/refs/heads" --jq '.[].ref' | grep token-probe | while read -r REF; do
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/$REF" && echo "deleted $REF"
          done
          true
