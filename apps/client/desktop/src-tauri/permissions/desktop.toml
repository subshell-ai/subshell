# The app's own ACL manifest.
#
# Its EXISTENCE is the security boundary, not just its contents. Tauri gates an
# app command when `plugin_command.is_some() || has_app_acl_manifest ||
# !is_local` (tauri 2.11.5, webview/mod.rs). Without this file, every app
# command is ungated for every LOCAL window — so any window added later would
# silently inherit the ability to drive the CLI. With it, each command is
# granted deliberately, per window.
#
# That second window now exists. `main` shows a control plane's own UI, loaded
# from the plane's own origin, and every `allow-node-*` permission below reaches
# the bundled `node` page and nothing else — nothing that drives the `subshell`
# CLI is reachable from a page this repo did not ship.
#
# `main` holds exactly ONE permission (2026-09-14),
# `allow-desktop-open-in-browser`, and it is named `desktop_` rather than
# `node_` to say out loud that it is not a node verb. A control plane can live
# on any host, so `capabilities/main.json`'s scope is a WILDCARD —
# `apps/server/desktop` can pin its remote window to loopback because it manages
# the server serving it, and there is no equivalent pin here. The narrowness
# therefore lives in the command's ARGUMENT instead: a path, refused if it could
# name a host, joined onto the origin that window is already pinned to. A second
# permission here is a change to the trust model, not a convenience; see
# `docs/security.md` and the pin in `ui/src/__tests__/ipc-acl.test.ts`.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-node-probe"
description = "Read what it would take to get this machine registered and its agent running. Read-only, and never uses `subshell status --probe`, which supersede-kicks a live agent."
commands.allow = ["node_probe"]

[[permission]]
identifier = "allow-node-install-agent"
description = "Install the bundled subshell agent to ~/.local/bin, stopping the managed service first."
commands.allow = ["node_install_agent"]

[[permission]]
identifier = "allow-node-install-tmux"
description = "Install tmux with this machine's own package manager, so a node registered here can open a pane at all. Runs what the user would have run in a terminal, with their own privileges, from a table in crates/desktop-core that Subshell Server drives too: Homebrew on macOS, pkexec apt-get on Linux — never a bare sudo, which a GUI has no terminal to answer. Nothing from the page reaches the argv; where no manager can be driven it refuses and the screen names the command to type."
commands.allow = ["node_install_tmux"]

[[permission]]
identifier = "allow-node-enroll"
description = "Register this machine as a node via `subshell enroll`. Destructive: it overwrites an existing config.json, mints a SECOND node row on the control plane, and discards the old node key — whose only home was that file."
commands.allow = ["node_enroll"]

[[permission]]
identifier = "allow-node-configure"
description = "Repoint this machine's node at a different control plane via `subshell configure`. NON-destructive, which is what separates it from enroll: it spends no setup key, mints no second node row, and keeps the node key — so it only works when both addresses are one plane under two names; a different plane refuses the node key and the node goes offline until it is pointed back or enrolled afresh. It also repoints this app's own stored plane address, so the two cannot diverge. It does not rename: the plane owns a node's name."
commands.allow = ["node_configure"]

[[permission]]
identifier = "allow-node-service"
description = "Drive one `subshell service` verb. Includes stop and restart, which end every subshell running on this machine unless the installed unit keeps them."
commands.allow = ["node_service"]

[[permission]]
identifier = "allow-node-open-path"
description = "Reveal one of a fixed set of the app's own directories or log files in the OS file manager. The set is closed in Rust; the page names a member, never a path."
commands.allow = ["node_open_path"]

[[permission]]
identifier = "allow-node-arm-reset"
description = "Read this machine now and stash the reset's delete plan, taken from the agent's own `status --json` rather than derived here. Changes nothing; answers only whether a plan parsed, which is how the screen knows to render its refusal on a machine that is not enrolled."
commands.allow = ["node_arm_reset"]

[[permission]]
identifier = "allow-node-reset"
description = "Return this machine to un-enrolled: stop and uninstall the node service, close this node's pane servers, and delete the data directory, the lock file and config.json — the node key's only home. Irreversible, gated on the typed hostname, and it deletes EXACTLY the stashed plan; the page supplies a hostname, never a path. The installed ~/.local/bin/subshell and the control plane's own node row are deliberately left alone."
commands.allow = ["node_reset"]

[[permission]]
identifier = "allow-node-settings"
description = "Read the app's own preferences."
commands.allow = ["node_settings"]

[[permission]]
identifier = "allow-node-open-plane"
description = "Open the window showing a control plane's own UI, and remember its address. Validated http/https only. That window holds exactly ONE command of its own, allow-desktop-open-in-browser, which takes a path and can name no host; nothing that drives the CLI is reachable from it."
commands.allow = ["node_open_plane"]

[[permission]]
identifier = "allow-node-set-plane"
description = "Remember a control plane's address without opening anything. The persisting half of allow-node-open-plane, validated http/https by the same rule, so a setup flow can record the plane it is enrolling against without a dashboard appearing over the question it is still asking. Opens no window and grants that window nothing: it writes one field of this app's own settings file."
commands.allow = ["node_set_plane"]

[[permission]]
identifier = "allow-node-open-plane-url"
description = "Open the control plane's address in the system browser. The URL is re-read from this app's own stored ladder and http(s)-validated; none of it comes from the page."
commands.allow = ["node_open_plane_url"]

[[permission]]
identifier = "allow-node-pending-screen"
description = "Read (and clear) the screen this window was opened for — About, or nothing. A pull, because a push emitted while the window is still loading reaches a page that is not listening yet. Answers one word this app chose; names no path and changes nothing."
commands.allow = ["node_pending_screen"]

[[permission]]
identifier = "allow-node-about"
description = "Read who made this app, its version, and the licence terms — the strings the About footer renders. No machine state, nothing writable, no paths."
commands.allow = ["node_about"]

[[permission]]
identifier = "allow-node-open-web"
description = "Open ONE of three fixed pages in the system browser: the product's site, the repository's LICENSE, or the copyright holder's site. A closed enum, never a URL, so the page names which of the three and this side decides what it is."
commands.allow = ["node_open_web"]

[[permission]]
identifier = "allow-node-check-app-update"
description = "Ask the project's release list whether a newer Subshell Client APP exists — not the node agent it wraps. Takes no argument, downloads nothing and changes nothing: one GET of a public JSON list, and one manifest the updater plugin verifies against the public key compiled into this build. The bundled page only, like every node verb."
commands.allow = ["node_check_app_update"]

[[permission]]
identifier = "allow-node-install-app-update"
description = "Download, verify, install and relaunch into the newest Subshell Client app. Takes NO argument — the release is re-resolved in Rust, so the page asks for 'the newest' and never for a URL — and the bytes are refused unless they carry a minisign signature matching the public key in tauri.conf.json, which is what keeps the release host able only to withhold an update. On Linux it hands the .deb to dpkg behind a polkit prompt. It replaces the APPLICATION and leaves the installed node agent alone: the bundled agent is a source to install from, never a rung of the resolution ladder."
commands.allow = ["node_install_app_update"]

[[permission]]
identifier = "allow-desktop-open-in-browser"
description = "Open one page of the control plane this window is already on, in the system browser. `desktop_`, not `node_`, because it is the one permission in this file that is NOT a node verb: it is granted to `main` — the plane's own page — and to nothing else, which is the opposite of every rule above it. It takes a PATH and nothing else (no scheme, no protocol-relative '//host', no backslash, no whitespace or control characters — crates/desktop-core's browser::browser_url) and joins it onto the origin windows.rs's PlanePin holds, so the page names the route and this side names the host. The tray and menu-bar routes to the same act need no permission at all: they run in Rust."
commands.allow = ["desktop_open_in_browser"]
