<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no is IGNORED by Safari browser (accessibility mandate) but HONORED by
         home-screen PWAs (WKWebView) — where it is the only defense against WebKit's auto-zoom
         on sub-16px inputs persisting its scale+viewport damage across app restarts. A terminal
         app does not page-zoom; xterm owns its own font size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Subshell</title>
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Chrome deprecation (2026-09): the apple- spelling is no longer enough on its own.
         Both stay: iOS Safari and the WKWebView home-screen shell read only the
         apple- tags (status-bar-style has no standard twin), Android and desktop
         Chrome read the standards-track one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
