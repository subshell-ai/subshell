<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subshell Server</title>
  </head>
  <body>
    <!-- The first-run wizard (§ 5 of the 2026-09-10 spec). Same CSP rules as
         index.html: module script with a src, nothing inline; same window,
         same tokens - the wizard is this app's page, not a different product. -->
    <h1 class="m-0 mb-0.5 text-[17px] font-semibold tracking-[0.01em]">Set up Subshell Server</h1>
    <ul class="rail mb-3" id="rail" aria-label="Setup progress"></ul>
    <div class="mb-3 rounded-[10px] border border-line bg-card px-4 py-3.5">
      <p class="mb-2.5 text-sm text-warn empty:hidden" id="problem"></p>
      <div id="screen"></div>
      <div class="mt-3 flex flex-wrap items-center gap-2" id="screen-actions"></div>
    </div>
    <!-- The chain's verbatim words live here, not in a console-style tabbed
         pane: the wizard has one log because it runs one chain. Hidden until
         something has been said. -->
    <div class="mb-3 rounded-[10px] border border-line bg-card px-4 pb-3.5 pt-2.5" id="output-card" hidden>
      <pre class="pane-pre" id="output" aria-live="polite"></pre>
    </div>
    <script type="module" src="/src/wizard.ts"></script>
  </body>
</html>
