  <body class="assistant">
    <!-- The assistant (spec 2026-09-21): one React host in one mount point.
         `main.tsx` renders `<Host/>`, whose frames, bars and the reset view
         are components; the page keeps the `wizard.html` name because the
         name is an IDENTIFIER — `WebviewUrl::App("wizard.html")` in
         `windows.rs`, the `wizard` window label, and the capability file keyed
         to it — while the page it carries is first run, recovery, update and
         reset. Renaming it would move four things to rename one. The CSP rules
         are unchanged (a module script with a src, nothing inline) and pinned
         by `__tests__/tauri-config.test.ts`. -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
