# The app's own ACL manifest.
#
# Its EXISTENCE is the security boundary, not just its contents. Tauri gates an
# app command when `plugin_command.is_some() || has_app_acl_manifest ||
# !is_local` (tauri 2.11.5, webview/mod.rs). Without this file, every app
# command is ungated for every LOCAL window — so any window added later would
# silently inherit the ability to drive the CLI. With it, each command is
# granted deliberately, per window.
#
# The split that matters is window KIND, and there are two windows now (spec
# 2026-09-12 § 5.1): `wizard` is the ASSISTANT, a bundled page this repo
# ships, and it holds every command that drives the CLI — first run, recovery,
# update and reset all live there. `main` shows the SERVER's own SPA and gets
# only the three that cannot touch the CLI, the config, the service or the
# filesystem, and only over loopback. See `capabilities/main.json`.

"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-desktop-logs"
description = "Read a tail of the server's own capped log file, falling back to the service manager's log (the journal on Linux, the plist's file on macOS) where the server names none. Takes no path: this side decides what the server's log IS."
commands.allow = ["desktop_logs"]

[[permission]]
identifier = "allow-desktop-probe"
description = "Read what it would take to reach a running server. Read-only."
commands.allow = ["desktop_probe"]

[[permission]]
identifier = "allow-desktop-install-server"
description = "Install the bundled subshell-server to ~/.local/bin, stopping the managed service first."
commands.allow = ["desktop_install_server"]

[[permission]]
identifier = "allow-desktop-install-tmux"
description = "Install tmux with the platform's own package manager (brew on macOS where present, pkexec apt-get on Linux). Runs the same command the user would run in a terminal, with their own privileges."
commands.allow = ["desktop_install_tmux"]

[[permission]]
identifier = "allow-desktop-setup"
description = "The whole first-run chain in one call: install the bundled server, write config.env with the CLI's defaults, register the login service, start it. Stops at the first failure. Assistant-only: the server-origin page gets no part of the CLI."
commands.allow = ["desktop_setup"]

[[permission]]
identifier = "allow-desktop-service"
description = "Drive one `subshell-server service` verb. Includes stop and restart, which can end running subshells."
commands.allow = ["desktop_service"]

[[permission]]
identifier = "allow-desktop-reset"
description = "Wipe this machine's Subshell instance: stop and uninstall the service, close this instance's panes, delete the paths status reported, and clear this app's choices. Takes ONLY the typed hostname; the paths are a plan Rust captured when the screen was opened, and the command refuses without one. Assistant window only."
commands.allow = ["desktop_reset"]

[[permission]]
identifier = "allow-desktop-arm-reset"
description = "Read this machine now and stash the reset's delete plan, so the assistant can re-arm on every press of its own Reset screen. Assistant-only: the server-origin page still names a SCREEN and nothing else."
commands.allow = ["desktop_arm_reset"]

[[permission]]
identifier = "allow-desktop-set-server-bin"
description = "Remember an explicitly chosen server binary. The path is executed on every launch."
commands.allow = ["desktop_set_server_bin"]

[[permission]]
identifier = "allow-desktop-open-main"
description = "Open the window showing the server's own UI."
commands.allow = ["desktop_open_main"]

[[permission]]
identifier = "allow-desktop-open-assistant"
description = "Raise the assistant window, optionally at the reset or update screen. Executes nothing: the argument names a SCREEN from a closed enum, the update is a press inside the bundled page, and the reset needs the hostname typed there. Arming `reset` performs one read-only `status --json`, which the app already runs on its own watch."
commands.allow = ["desktop_open_assistant"]

[[permission]]
identifier = "allow-desktop-shell-ready"
description = "The SPA reporting that it has rendered desktop chrome, so the window can drop its title bar. Safe for the server-origin page: it changes this app's own window and nothing else."
commands.allow = ["desktop_shell_ready"]

[[permission]]
identifier = "allow-desktop-open-path"
description = "Reveal one of a fixed set of the server's own files or directories in the OS file manager. The set is closed in Rust; the page names a member, never a path."
commands.allow = ["desktop_open_path"]

[[permission]]
identifier = "allow-desktop-open-tmux-docs"
description = "Open the tmux formula page in the system browser. The URL is a constant in this app, not an argument from the page — the same boundary desktop_open_control_plane keeps."
commands.allow = ["desktop_open_tmux_docs"]

[[permission]]
identifier = "allow-desktop-notify"
description = "Show one native notification. The shape is fixed here — a title and a body, nothing schedulable or enumerable — so the server-origin page never receives the notification plugin itself."
commands.allow = ["desktop_notify"]

[[permission]]
identifier = "allow-desktop-about"
description = "Read who made this app, its version, and the licence terms — the strings the About section renders. No machine state, nothing writable, no paths."
commands.allow = ["desktop_about"]

[[permission]]
identifier = "allow-desktop-open-web"
description = "Open ONE of three fixed pages in the system browser: the product's site, the repository's LICENSE, or the copyright holder's site. A closed enum, never a URL, so the page names which of the three and this side decides what it is."
commands.allow = ["desktop_open_web"]
