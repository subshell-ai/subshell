<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subshell Server</title>
    <style>
      /* Dreamframe (Castorice) — the same ground and accents apps/frontend
         paints, hand-copied because this page deliberately ships no framework
         and no design-system dependency: it must render with the server down. */
      :root {
        --bg: oklch(0.224 0.035 296);
        --card: oklch(0.264 0.038 298);
        --border: oklch(0.34 0.04 300);
        --fg: oklch(0.94 0.01 300);
        --muted: oklch(0.68 0.03 300);
        --primary: oklch(0.72 0.13 330);
        --primary-fg: oklch(0.18 0.04 300);
        --ok: oklch(0.74 0.14 155);
        --warn: oklch(0.8 0.14 80);
        --bad: oklch(0.68 0.19 20);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 22px 24px 28px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: 0.01em; }
      .sub { color: var(--muted); margin: 0 0 18px; font-size: 12px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
      .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin-top: 10px; font-size: 12px; }
      .facts dt { color: var(--muted); }
      .facts dd { margin: 0; word-break: break-all; }
      .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
      .dot.ok { background: var(--ok); }
      .dot.warn { background: var(--warn); }
      .dot.bad { background: var(--bad); }
      button {
        font: inherit;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--primary); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; font-weight: 600; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      input {
        font: inherit;
        width: 100%;
        padding: 6px 9px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
      }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      pre {
        margin: 10px 0 0;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 220px;
        overflow: auto;
      }
      pre:empty { display: none; }
      .warn-text { color: var(--warn); }
      .bad-text { color: var(--bad); }
      .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Subshell Server</h1>
    <p class="sub">This machine's control plane — installed, configured and run from here.</p>

    <div class="card">
      <div class="row">
        <span class="chip"><span class="dot" id="dot"></span><span id="state">Checking…</span></span>
        <button type="button" id="refresh">Refresh</button>
      </div>
      <dl class="facts" id="facts"></dl>
    </div>

    <div class="card" id="step-card">
      <div id="step-body"></div>
      <div class="actions" id="step-actions"></div>
      <div class="hint" id="step-hint"></div>
    </div>

    <pre id="output"></pre>

    <script>
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
      const el = (id) => document.getElementById(id);
      let probe = null;
      let busy = false;

      /** The CLI owns every operator-facing message; show its words verbatim. */
      function show(result) {
        const parts = [];
        if (result?.stdout?.trim()) parts.push(result.stdout.trim());
        if (result?.stderr?.trim()) parts.push(result.stderr.trim());
        el("output").textContent = parts.join("\n\n");
      }

      function fact(dl, key, value, cls) {
        const dt = document.createElement("dt");
        dt.textContent = key;
        const dd = document.createElement("dd");
        dd.textContent = value;
        if (cls) dd.className = cls;
        dl.append(dt, dd);
      }

      function renderFacts() {
        const dl = el("facts");
        dl.textContent = "";
        const svc = probe?.service ?? null;
        const st = probe?.status ?? null;
        if (probe?.server) {
          fact(dl, "server", `${probe.server.version ?? "?"} — ${probe.server.argv.join(" ")}`);
          fact(dl, "found via", probe.server.source);
        }
        if (probe?.bundledVersion) {
          const note =
            probe.serverChoice === "adopt-installed"
              ? " — the installed server is newer, so it is the one in use"
              : probe.serverChoice === "upgrade-available"
                ? " — newer than the installed one"
                : "";
          fact(dl, "bundled", probe.bundledVersion + note, note ? "warn-text" : null);
        }
        if (st?.configEnv) fact(dl, "config.env", `${st.configEnv.path} (${st.configEnv.exists ? "present" : "missing"})`);
        if (st?.settings?.APP_BASE_URL) fact(dl, "base URL", st.settings.APP_BASE_URL.value);
        if (st?.tmux !== undefined) {
          fact(dl, "tmux", st.tmux ?? "NOT FOUND — every local pane needs it", st.tmux ? null : "bad-text");
        }
        if (svc?.installed) {
          fact(dl, "service", svc.definitionPath);
          fact(dl, "manager", svc.state + (svc.pid ? ` (pid ${svc.pid})` : ""));
          // The one fact neither systemctl nor launchctl will tell them.
          if (svc.paneSafety === "kills") {
            fact(dl, "teardown", "kills live panes — reinstall the service definition", "warn-text");
          } else if (svc.paneSafety === "unknown") {
            fact(dl, "teardown", "unknown — the definition could not be read", "warn-text");
          }
        }
      }

      /** Wrap an action so the UI cannot fire two at once and always re-probes. */
      function guard(fn) {
        return async (...args) => {
          if (busy) return;
          busy = true;
          render();
          try {
            const result = await fn(...args);
            if (result) show(result);
          } catch (err) {
            show({ stderr: String(err) });
          } finally {
            busy = false;
            await refresh();
          }
        };
      }

      const act = (cmd, args) => guard(() => invoke(cmd, args));

      const doInit = guard(() =>
        invoke("desktop_init", { port: el("port")?.value ?? "3080", host: el("host")?.value ?? "127.0.0.1" }),
      );

      // Restart is refused outright when the installed definition would kill
      // live panes. Surface that as a choice rather than retrying silently.
      const doRestart = guard(async () => {
        const first = await invoke("desktop_service", { verb: "restart", force: false });
        if (first.ok || !first.stderr.includes("refusing to restart")) return first;
        const proceed = await window.__TAURI__.dialog.ask(
          `${first.stderr.trim()}\n\nRestart anyway and lose those sessions?`,
          { title: "This will kill running subshells", kind: "warning", okLabel: "Restart anyway" },
        );
        return proceed ? invoke("desktop_service", { verb: "restart", force: true }) : first;
      });

      const openMain = guard(() => invoke("desktop_open_main"));

      const pickBinary = guard(async () => {
        const chosen = await window.__TAURI__.dialog.open({ multiple: false, directory: false, title: "Choose subshell-server" });
        if (!chosen) return null;
        await invoke("desktop_set_server_bin", { path: chosen });
        return { stdout: `Using ${chosen}` };
      });

      const STEPS = {
        "no-server": {
          body: "No <code>subshell-server</code> was found, and this build does not ship one.",
          hint: "Point the app at a server binary you already have.",
          actions: [["Choose subshell-server…", pickBinary, true]],
        },
        "install-server": {
          body: "Ready to install the bundled <code>subshell-server</code> to <code>~/.local/bin</code>.",
          hint: "Nothing is downloaded — the server ships inside this app.",
          actions: [["Install server", act("desktop_install_server"), true], ["Choose an existing one…", pickBinary]],
        },
        init: {
          body: "The server has no <code>config.env</code> yet. Choose a port and host.",
          hint: "Written to ~/.config/subshell-server/config.env (0600), with a fresh auth secret.",
          form: true,
          actions: [["Create configuration", doInit, true]],
        },
        "install-service": {
          body: "Configured. Install it as a background service so it starts at login.",
          hint: "A systemd user unit on Linux, a launchd agent on macOS.",
          actions: [["Install as a service", act("desktop_service", { verb: "install", force: false }), true]],
        },
        start: {
          body: "The service is installed but not running.",
          actions: [
            ["Start", act("desktop_service", { verb: "start", force: false }), true],
            ["Uninstall service", act("desktop_service", { verb: "uninstall", force: false })],
          ],
        },
        ready: {
          body: "The server is running.",
          actions: [
            ["Open Subshell", openMain, true],
            ["Restart", doRestart],
            ["Stop", act("desktop_service", { verb: "stop", force: false })],
          ],
        },
      };

      function renderStep() {
        const step = STEPS[probe?.next] ?? { body: "Checking this machine…", actions: [] };
        el("step-body").innerHTML = step.body;
        el("step-hint").textContent = step.hint ?? "";
        const actions = el("step-actions");
        actions.textContent = "";
        // A newer bundled server is OFFERED alongside whatever the current step
        // is — never applied unasked. The reverse case (a newer server already
        // installed) is adopted silently and is not a choice: server boot runs
        // forward-only migrations, so pointing an older binary at a migrated
        // database is data loss rather than a downgrade.
        if (probe?.serverChoice === "upgrade-available") {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = `Update server to ${probe.bundledVersion}`;
          b.disabled = busy;
          b.addEventListener("click", act("desktop_install_server"));
          actions.append(b);
        }
        if (step.form) {
          const wrap = document.createElement("div");
          wrap.className = "grid2";
          wrap.style.width = "100%";
          wrap.innerHTML =
            '<div><label for="port">Port</label><input id="port" value="3080" inputmode="numeric" /></div>' +
            '<div><label for="host">Host</label><input id="host" value="127.0.0.1" /></div>';
          actions.append(wrap);
        }
        for (const [label, handler, primary] of step.actions) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = label;
          if (primary) b.className = "primary";
          b.disabled = busy;
          b.addEventListener("click", handler);
          actions.append(b);
        }
      }

      function renderChip() {
        const dot = el("dot");
        const svc = probe?.service;
        const running = svc?.state === "running";
        dot.className = `dot ${running ? "ok" : probe?.next === "ready" ? "ok" : svc?.installed ? "warn" : ""}`;
        el("state").textContent = busy
          ? "Working…"
          : running
            ? "Running"
            : svc?.installed
              ? `Installed — ${svc.state}`
              : probe?.server
                ? "Not installed as a service"
                : "No server found";
      }

      function render() {
        renderChip();
        renderFacts();
        renderStep();
      }

      async function refresh() {
        probe = await invoke("desktop_probe");
        render();
      }

      el("refresh").addEventListener("click", guard(async () => null));
      refresh();
    </script>
  </body>
</html>
