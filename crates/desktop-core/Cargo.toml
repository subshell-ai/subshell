[package]
name = "subshell-desktop-core"
version = "0.1.0"
license = "Apache-2.0"
description = "Tauri-free plumbing shared by the Subshell desktop apps"
edition = "2021"
rust-version = "1.82"

# Its own workspace root, deliberately. Each desktop app keeps its own
# `Cargo.lock` and its own `target/` and pulls this in by relative `path`;
# there is no repo-root cargo workspace to join, and adding one would make a
# Rust build of either app a build of both.
[workspace]

# `tauri` is absent on purpose — see the crate docs in src/lib.rs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

# `permissions` only, and macOS only — Linux has none of the prompts this
# answers for, so every one of these would be dead weight in the Linux build
# of two apps. Each is opened with `default-features = false` and exactly the
# framework pieces used: the `objc2-*` crates default to translating their
# WHOLE framework, which is minutes of compile time for three method calls.
#
# The versions are the ones already resolved in both apps' Cargo.lock
# (`objc2` 0.6.4, `block2` 0.6.2, the 0.3.2 framework family), so this adds
# no new resolution to either desktop app — tauri's own macOS stack already
# pulls that generation in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSBundle",
  "NSError",
  "NSObject",
  "NSString",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "UNNotificationSettings",
  "UNUserNotificationCenter",
] }
objc2-photos = { version = "0.3.2", default-features = false, features = ["std", "PHPhotoLibrary"] }
