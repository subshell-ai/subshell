<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>Subshell share card</title>
  <defs>
    <linearGradient id="slash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#744b8d"/>
      <stop offset="0.62" stop-color="#a678bd"/>
      <stop offset="1" stop-color="#d9c6e8"/>
    </linearGradient>
  </defs>
  <!-- The marketing void, the card's only ground. -->
  <rect width="1200" height="630" fill="#1d182a"/>
  <!-- The wordmaster, one 1.8x scale of wordmark.svg's own coordinate
       system (slash, sub, shell, the dotted trail), centered with the
       tagline beneath it. The tagline is the marketing description, already
       approved copy, set in the same Light face. -->
  <g font-family="Acherus Grotesque Light" font-size="100" letter-spacing="1.1">
    <g transform="translate(76 140) scale(1.8)">
      <text x="0" y="100" fill="url(#slash)">/</text>
      <text x="36.2" y="100" fill="#9c71ae">sub</text>
      <text x="218.5" y="100" fill="#e6dbef">shell</text>
      <rect x="468" y="54" width="11" height="11" rx="2" fill="#c39bd9"/>
      <rect x="488" y="24" width="9" height="9" rx="2" fill="#e6dbef"/>
      <rect x="507" y="58" width="5" height="5" rx="1.5" fill="#9c71ae"/>
      <rect x="525" y="37" width="7" height="7" rx="1.5" fill="#c39bd9"/>
      <rect x="542" y="67" width="3" height="3" rx="1" fill="#e6dbef"/>
      <rect x="564" y="47" width="3" height="3" rx="1" fill="#744b8d"/>
    </g>
    <text x="600" y="505" text-anchor="middle" font-size="40" fill="#b3a5c4">Your whole agent fleet, from any device.</text>
  </g>
</svg>
